<?xml version="1.0" encoding="UTF-8"?>
<!-- RollForge app icon. Source-only (no binary asset): a groovebox 2x2 pad grid,
     one pad lit in the app's teal accent, over the app's dark panel colour. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect x="8" y="8" width="240" height="240" rx="46" ry="46" fill="#1e1e24"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="45.5" ry="45.5" fill="none" stroke="#2a7a74" stroke-width="3"/>

  <!-- 2x2 pad grid -->
  <rect x="40"  y="40"  width="78" height="78" rx="14" ry="14" fill="#2fb3a8"/>
  <rect x="40"  y="40"  width="78" height="78" rx="14" ry="14" fill="none" stroke="#6fe6dc" stroke-width="2"/>
  <rect x="138" y="40"  width="78" height="78" rx="14" ry="14" fill="#33333b"/>
  <rect x="40"  y="138" width="78" height="78" rx="14" ry="14" fill="#33333b"/>
  <rect x="138" y="138" width="78" height="78" rx="14" ry="14" fill="#33333b"/>

  <!-- accelerating "roll" of hits across the lit pad -->
  <g fill="#0e2b29">
    <circle cx="58"  cy="79" r="4.5"/>
    <circle cx="72"  cy="79" r="4.5"/>
    <circle cx="84"  cy="79" r="4"/>
    <circle cx="94"  cy="79" r="3.5"/>
    <circle cx="101" cy="79" r="3"/>
    <circle cx="106" cy="79" r="2.5"/>
  </g>
</svg>
